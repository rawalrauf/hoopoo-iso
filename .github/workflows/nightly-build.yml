name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ISO
      run: |
        mkdir -p release
        docker run --rm \
          --privileged \
          -e "HOOPOO_INSTALLER_REPO=rawalrauf/hoopoo" \
          -e "HOOPOO_INSTALLER_REF=master" \
          -e "HOOPOO_MIRROR=stable" \
          -e "HOST_UID=$(id -u)" \
          -e "HOST_GID=$(id -g)" \
          -v "${{ github.workspace }}:/workspace" \
          -v "${{ github.workspace }}/release:/out" \
          archlinux/archlinux:latest \
          bash -c "
            pacman -Sy --noconfirm archlinux-keyring &&
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm git sudo jq &&
            cp -r /workspace/builder /builder &&
            cp -r /workspace/configs /configs &&
            mkdir -p /out &&
            bash /builder/build-iso.sh
          " 2>&1 | tee /tmp/build.log; status=${PIPESTATUS[0]}; grep -i 'broadcom\|apple-bcm\|target not found\|error:' /tmp/build.log | head -20; exit $status

    - name: Import GPG key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --sign --detach-sign --default-key "070030E5D914817BA797F66AAF1C8F036A5E73FD" /dev/null || true

    - name: Generate signatures and checksums
      run: |
        cd release
        ISO_FILE=$(ls *.iso | head -1)
        ISO_NAME=$(basename "$ISO_FILE")
        BASE_NAME="${ISO_NAME%.iso}"
        
        echo "ISO_FILE=$ISO_FILE" >> $GITHUB_ENV
        echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
        echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
        echo "DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV
        
        # Generate GPG signature
        echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --pinentry-mode loopback \
          --passphrase-fd 0 --sign --detach-sign \
          --default-key "070030E5D914817BA797F66AAF1C8F036A5E73FD" \
          --output "$ISO_NAME.sig" "$ISO_NAME"
        
        # Generate checksums
        sha256sum "$ISO_NAME" > sha256sums.txt
        b2sum "$ISO_NAME" > b2sums.txt
        
        echo "Generated files:"
        ls -lh *.iso *.sig *.txt

    - name: Upload to Cloudflare R2
      run: |
        cd release
        
        # Delete old ISO objects from R2
        aws s3 rm s3://hoopoo-iso/ --recursive \
          --endpoint-url "$R2_ENDPOINT_URL" || true
        
        # Upload versioned files
        aws s3 cp "$ISO_NAME" "s3://hoopoo-iso/$ISO_NAME" \
          --endpoint-url "$R2_ENDPOINT_URL"
        aws s3 cp "$ISO_NAME.sig" "s3://hoopoo-iso/$ISO_NAME.sig" \
          --endpoint-url "$R2_ENDPOINT_URL"
        
        # Upload checksums
        aws s3 cp sha256sums.txt "s3://hoopoo-iso/sha256sums.txt" \
          --endpoint-url "$R2_ENDPOINT_URL"
        aws s3 cp b2sums.txt "s3://hoopoo-iso/b2sums.txt" \
          --endpoint-url "$R2_ENDPOINT_URL"
        
        echo "Uploaded files to iso.hoopoo.net:"
        echo "- $ISO_NAME"
        echo "- $ISO_NAME.sig"
        echo "- sha256sums.txt"
        echo "- b2sums.txt"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}

    - name: Create GitHub Release on main repo
      run: |
        TAG="latest"
        DOWNLOAD_URL="https://iso.hoopoo.net/$ISO_NAME"

        # Delete old release if exists
        gh release delete "$TAG" --repo "rawalrauf/hoopoo" --yes 2>/dev/null || true
        git push origin --delete "$TAG" 2>/dev/null || true

        printf '## Download\n\n[%s](%s)\n\nBuilt from commit `%s` on %s.\n' \
          "$ISO_NAME" "$DOWNLOAD_URL" "${{ github.sha }}" "$DATE" > /tmp/release-notes.md

        gh release create "$TAG" \
          --repo "rawalrauf/hoopoo" \
          --title "Hoopoo ISO $DATE" \
          --notes-file /tmp/release-notes.md
      env:
        GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}

