#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://rc-mirror.hoopoo.org/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://rc-mirror.hoopoo.org/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[multilib]
Server = https://rc-mirror.hoopoo.org/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist


[arch-mact2]
Server = https://github.com/NoaHimesaka1873/arch-mact2-mirror/releases/download/release
SigLevel = Never

[hoopoo]
SigLevel = Optional TrustAll
Server = https://github.com/rawalrauf/hoopoo-pkgs/releases/download/stable

# TEMP: hoopoo mirror for hardware-specific packages not yet in hoopoo mirror
# TODO: Remove once all needed pkgs are added to hoopoo-pkgs repo
